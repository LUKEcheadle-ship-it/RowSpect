name: Capture RowSpect README screenshot

on:
  push:
    branches:
      - portfolio/rowspect-real-screenshot-20260929

permissions:
  contents: write

jobs:
  capture:
    if: ${{ !contains(github.event.head_commit.message, '[skip capture]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: portfolio/rowspect-real-screenshot-20260929

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install RowSpect and browser tooling
        run: |
          python -m pip install -r requirements.txt
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Start RowSpect
        run: |
          nohup python -m streamlit run app.py --server.headless=true --server.address=127.0.0.1 --server.port=8501 --browser.gatherUsageStats=false > /tmp/rowspect.log 2>&1 &
          python - <<'PY'
          import time, urllib.request
          deadline=time.time()+45
          while time.time()<deadline:
              try:
                  with urllib.request.urlopen("http://127.0.0.1:8501/_stcore/health", timeout=2) as r:
                      if r.status == 200:
                          raise SystemExit(0)
              except Exception:
                  time.sleep(1)
          raise SystemExit("RowSpect did not become healthy")
          PY

      - name: Capture real sample dashboard
        run: |
          mkdir -p docs/assets
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page(viewport={"width": 1440, "height": 1050}, device_scale_factor=1)
              page.goto("http://127.0.0.1:8501", wait_until="networkidle")
              page.get_by_text("Use the built-in sample", exact=True).click()
              page.wait_for_timeout(2500)
              page.screenshot(path="docs/assets/rowspect-dashboard.png", full_page=False)
              browser.close()
          PY

      - name: Commit screenshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/assets/rowspect-dashboard.png
          git commit -m "docs: capture real RowSpect product screenshot [skip capture]"
          git push origin HEAD:portfolio/rowspect-real-screenshot-20260929
