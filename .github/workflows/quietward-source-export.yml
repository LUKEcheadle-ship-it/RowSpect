name: QuietWard source export
on:
  push:
    branches: [review/public-project-checkouts-20261011]
    paths: [.github/workflows/quietward-source-export.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          repository: LUKEcheadle-ship-it/quietward
          ref: fbeada828ab865c17e1dff9d34c6fb304abb9d23
          path: source
          fetch-depth: 0
          persist-credentials: false
      - name: Export Git objects only; no QuietWard execution or qualification
        run: |
          mkdir -p output
          git -C source bundle create "$PWD/output/quietward-current.bundle" HEAD
          git -C source rev-parse HEAD > output/source-sha.txt
          sha256sum output/quietward-current.bundle > output/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: quietward-current-source
          path: output/
          retention-days: 3
          if-no-files-found: error
