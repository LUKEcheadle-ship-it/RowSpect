name: Native spreadsheet compatibility
on:
  push:
    branches: [review/finish-maintenance-20261012]
permissions:
  contents: read
jobs:
  native-workbook:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          path: harness
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ef12c1f210e8b0720939da529365270e89aecb65
          path: candidate
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare browser and native desktop
        run: |
          python -m pip install -e './candidate[dev]' playwright
          python -m playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gnumeric xvfb xdotool imagemagick
      - name: Reproduce actual browser exports from clean pinned source
        run: python candidate/scripts/verify_browser_workflows.py --output-dir "$RUNNER_TEMP/rowspect-browser"
      - name: Open cleaned and converted XLSX and CSV in native Gnumeric
        run: xvfb-run -a -s '-screen 0 1440x1000x24' python harness/review/native_workbook_check.py --browser-evidence "$RUNNER_TEMP/rowspect-browser" --output "$RUNNER_TEMP/rowspect-native"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-spreadsheet-evidence
          path: |
            ${{ runner.temp }}/rowspect-native/
            ${{ runner.temp }}/rowspect-browser/receipt.json
          retention-days: 7
          if-no-files-found: warn
