name: Public project review qualification

on:
  push:
    branches: [review/public-project-checkouts-20261011]
    paths: [.github/workflows/review-workspace.yml]

permissions:
  contents: read

jobs:
  rowspect-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          repository: LUKEcheadle-ship-it/RowSpect
          ref: ef12c1f210e8b0720939da529365270e89aecb65
          path: RowSpect
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install and qualify exact source
        working-directory: RowSpect
        run: |
          python -m pip install -e '.[dev]' playwright==1.63.0
          python scripts/qualify_release.py --require-ui
          python -m playwright install --with-deps chromium
      - name: Exercise real browser uploads and downloads
        working-directory: RowSpect
        run: python scripts/verify_browser_workflows.py --output-dir "$RUNNER_TEMP/rowspect-browser"
      - name: Require exact clean-source browser receipt
        run: |
          python - <<'PY'
          import json, os, pathlib
          receipt = json.loads((pathlib.Path(os.environ['RUNNER_TEMP']) / 'rowspect-browser/receipt.json').read_text())
          assert receipt['decision'] == 'PASS'
          assert receipt['source_sha'] == 'ef12c1f210e8b0720939da529365270e89aecb65'
          assert receipt['source_dirty'] is False
          assert receipt['native_spreadsheet_application_checked'] is False
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rowspect-browser-evidence
          path: ${{ runner.temp }}/rowspect-browser/
          retention-days: 7
          if-no-files-found: warn

  response-native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: LUKEcheadle-ship-it/quietward-response
          ref: 972bac1be241f2701d362b6a2e471423f66f8517
          path: quietward-response
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned backend environment
        run: python -m pip install -r quietward-response/backend/requirements.txt
      - name: Full backend and platform regression suite
        working-directory: quietward-response/backend
        run: python -m pytest -W error
      - name: Native disposable-process containment and stale-target refusal
        working-directory: quietward-response
        run: python scripts/verify_vnext_process_containment.py
      - name: Audit public source contents
        working-directory: quietward-response
        run: python scripts/audit_public_release.py

  response-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: LUKEcheadle-ship-it/quietward-response
          ref: 972bac1be241f2701d362b6a2e471423f66f8517
          path: quietward-response
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare isolated browser environment
        working-directory: quietward-response
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r backend/requirements.txt playwright==1.63.0
          .venv/bin/python -m playwright install --with-deps chromium
      - name: Typecheck build and dependency audit
        working-directory: quietward-response/frontend
        run: |
          npm ci --ignore-scripts
          npm run typecheck
          npm run build
          npm audit --audit-level=high
      - name: Check ports are unused before synthetic demo setup
        run: |
          python - <<'PY'
          import socket
          for port in (8002, 3001):
              with socket.socket() as sock:
                  sock.bind(('127.0.0.1', port))
          PY
      - name: Exercise analyst interface with synthetic incidents only
        working-directory: quietward-response
        run: .venv/bin/python scripts/verify_frontend_browser.py --root "$PWD" --output "$RUNNER_TEMP/response-browser"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: response-browser-evidence
          path: |
            ${{ runner.temp }}/response-browser/receipt.json
            ${{ runner.temp }}/response-browser/*.png
            ${{ runner.temp }}/response-browser/*.log
            ${{ runner.temp }}/response-browser/failure.txt
          retention-days: 7
          if-no-files-found: warn
