name: Public project review workspace

on:
  push:
    branches: [review/public-project-checkouts-20261011]

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: LUKEcheadle-ship-it/RowSpect
          ref: 70cb38b1a60d7a5c683ca32ec9d4b231c46bc392
          path: RowSpect
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: LUKEcheadle-ship-it/quietward-response
          ref: ba81aaec66dea4b323a61b359ad5212bcbff38a6
          path: quietward-response
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Export pinned public sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p snapshot/bundles snapshot/wheels
          for repo in RowSpect quietward-response; do
            git -C "$repo" bundle create "$GITHUB_WORKSPACE/snapshot/bundles/$repo.bundle" --all HEAD
            git -C "$repo" bundle verify "$GITHUB_WORKSPACE/snapshot/bundles/$repo.bundle"
          done
          python -m pip download --dest snapshot/wheels 'setuptools>=70' wheel
      - name: Prepare reviewed frontend dependencies without lifecycle scripts
        working-directory: quietward-response/frontend
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --cache "$GITHUB_WORKSPACE/frontend-cache"
          npm audit --audit-level=high --json > "$GITHUB_WORKSPACE/snapshot/frontend-audit.json"
          tar -czf "$GITHUB_WORKSPACE/snapshot/frontend-node-modules.tar.gz" node_modules
          tar -czf "$GITHUB_WORKSPACE/snapshot/frontend-cache.tar.gz" -C "$GITHUB_WORKSPACE/frontend-cache" _cacache
      - name: Record source and artifact hashes
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, pathlib, platform, subprocess
          root = pathlib.Path('snapshot')
          refs = {name: subprocess.check_output(['git', '-C', name, 'rev-parse', 'HEAD'], text=True).strip() for name in ['RowSpect', 'quietward-response']}
          hashes = {str(p.relative_to(root)): hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(root.rglob('*')) if p.is_file()}
          (root / 'manifest.json').write_text(json.dumps({'purpose': 'pinned public source and offline validation dependencies; no credentials or runtime data', 'python': platform.python_version(), 'refs': refs, 'sha256': hashes}, indent=2) + '\n', encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: resumed-public-project-sources
          path: snapshot/
          retention-days: 3
          compression-level: 0
          if-no-files-found: error
