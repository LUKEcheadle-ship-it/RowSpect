[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "rowspect"
version = "1.3.0"
description = "Local-first CSV/XLSX data quality profiling, validation, safe cleanup, comparison, and reusable rule profiles."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "pandas>=2.2,<3",
  "streamlit>=1.55,<2",
  "openpyxl>=3.1,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
rowspect = "rowspect.cli:main"

[tool.setuptools.packages.find]
include = ["rowspect*"]
exclude = ["sample_data*", "tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
