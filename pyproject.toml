[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "rowspect"
version = "0.1.0"
description = "Local-first data quality profiling for CSV and Excel files."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "pandas>=2.2,<4",
  "streamlit>=1.55,<2",
  "openpyxl>=3.1,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
